<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Academic curriculum vitae of Yixuan Zhang.">
  <title>Curriculum Vitae — Yixuan Zhang</title>
  <style>
    :root { color-scheme: light; --ink:#172b3a; --muted:#667785; --accent:#235979; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f6f8fa; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; }
    .wrap { max-width:1070px; margin:auto; padding:42px 22px 70px; }
    .eyebrow { text-transform:uppercase; letter-spacing:.14em; color:var(--muted); font-size:12px; font-weight:650; }
    h1 { margin:12px 0 8px; font-size:clamp(33px,5vw,46px); font-family:Georgia,"Times New Roman",serif; font-weight:500; }
    .sub { color:var(--muted); line-height:1.6; margin:0; }
    .actions { display:flex; gap:11px; margin:25px 0; flex-wrap:wrap; }
    .button { border:1px solid var(--accent); border-radius:5px; padding:11px 16px; text-decoration:none; font-weight:600; font-size:14px; }
    .primary { background:var(--accent); color:white; }
    .secondary { color:var(--accent); background:white; }
    .button:hover { opacity:.86; }
    .viewer { background:white; border:1px solid #d7dfe4; box-shadow:0 4px 24px rgba(0,0,0,.04); border-radius:7px; overflow:hidden; }
    .viewer header { border-bottom:1px solid #d7dfe4; padding:14px 17px; font-size:13px; color:var(--muted); }
    .viewer iframe { border:0; display:block; width:100%; height:78vh; min-height:510px; }
    footer { color:var(--muted); font-size:12px; margin-top:24px; }
    @media (max-width:640px) { .wrap {padding:26px 12px 42px;} .viewer iframe {min-height:440px;height:70vh;} .button {flex:1;text-align:center;} }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">Academic Curriculum Vitae</p>
    <h1>Yixuan Zhang</h1>
    <p class="sub">University of Wisconsin–Madison</p>
    <nav class="actions" aria-label="CV links">
      <a class="button primary" href="./CV-Yixuan.pdf" download>Download CV (PDF)</a>
      <a class="button secondary" href="./CV-Yixuan.pdf" target="_blank" rel="noopener">Open PDF</a>
      <a class="button secondary" href="https://sites.google.com/wisc.edu/yixuanzhang/home" target="_blank" rel="noopener">Personal Website ↗</a>
    </nav>
    <section class="viewer" aria-label="Curriculum vitae preview">
      <header>Curriculum Vitae · <a href="./CV-Yixuan.pdf" target="_blank" rel="noopener">Open full PDF</a></header>
      <iframe src="./CV-Yixuan.pdf#view=FitH" title="Yixuan Zhang CV"></iframe>
    </section>
    <footer>© 2026 Yixuan Zhang</footer>
  </main>
</body>
</html>
